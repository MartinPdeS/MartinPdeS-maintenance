[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "martinpdes-maintenance"
version = "0.2.1"
description = "Shared release preparation and metadata checks for scientific Python projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
testing = ["pytest>=8,<10", "setuptools-scm>=8,<10"]
scm = ["setuptools-scm>=8,<10"]
dev = ["pytest>=8,<10", "ruff==0.17.2", "build>=1,<2", "twine>=6,<7"]

[project.scripts]
mps-maintenance = "martinpdes_maintenance.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["martinpdes_maintenance", "martinpdes_maintenance.*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
