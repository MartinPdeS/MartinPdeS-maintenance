name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    uses: MartinPdeS/MPSActions/.github/workflows/run_tests.yml@v2
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install-command: python -m pip install -e ".[testing]"
      test-command: python -m pytest -q

  quality:
    uses: MartinPdeS/MPSActions/.github/workflows/run_quality.yml@v2
    with:
      install-command: python -m pip install -e ".[dev]"
      quality-command: |
        python -m ruff check .
        python -m ruff format --check .

  build:
    uses: MartinPdeS/MPSActions/.github/workflows/build_pure_package.yml@v2
    with:
      python_version: "3.11"
      test_import: martinpdes_maintenance
      artifact_identity: wheels-pure
      download_retries: 3
      retry_delay_seconds: 10
